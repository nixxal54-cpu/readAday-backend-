# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Deploy readAday Backend on Render (https://render.com)
# ==============================================================================

services:
  # 1. Main readAday Web Service (Express REST API)
  - type: web
    name: readaday-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
      # Configure your Supabase project keys in Render Dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true

  # 2. Render Cron Job: Scheduled Article Publishing
  # Automatically runs every 5 minutes to release scheduled articles
  - type: cron
    name: readaday-scheduled-publisher
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run cron:publish
    envVars:
      - key: NODE_ENV
        value: production
      - fromService:
          type: web
          name: readaday-backend
          envVarKey: SUPABASE_URL
      - fromService:
          type: web
          name: readaday-backend
          envVarKey: SUPABASE_SERVICE_ROLE_KEY

  # 3. Render Cron Job: Automated News RSS Ingestion
  # Automatically runs every 30 minutes to ingest, deduplicate, and enforce copyright
  - type: cron
    name: readaday-news-ingestion
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/30 * * * *"
    buildCommand: npm install
    startCommand: npm run cron:news
    envVars:
      - key: NODE_ENV
        value: production
      - fromService:
          type: web
          name: readaday-backend
          envVarKey: SUPABASE_URL
      - fromService:
          type: web
          name: readaday-backend
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
